[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "debugging-engine"
version = "1.0.5"
description = "Debugging Engine — agent-agnostic investigation kernel + CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "rich>=13.7",
  "pytest>=8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
debugging-engine = "debugging_engine.cli:app"

[project.urls]
Homepage = "https://github.com/NguyenGiaThuy/debugging-engine"
Repository = "https://github.com/NguyenGiaThuy/debugging-engine"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
debugging_engine = [
  "integrations/templates/skills/**/*",
  "runtime/stubs/fixtures/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
